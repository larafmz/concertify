services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: concertify_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d concertify_production"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      bash -c "
        bin/rails db:prepare &&
        bin/rails runner 'unless ActiveRecord::Base.connection.data_source_exists?(\"solid_queue_jobs\"); load Rails.root.join(\"db/queue_schema.rb\"); end' &&
        bin/rails runner 'unless ActiveRecord::Base.connection.data_source_exists?("solid_cable_messages"); load Rails.root.join("db/cable_schema.rb"); end' &&
        bin/rails db:seed &&
        SECRET_KEY_BASE_DUMMY=1 bin/rails assets:precompile &&
        bin/rails server -b 0.0.0.0
      "
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - storage_data:/app/storage
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/concertify_production
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: bin/jobs start
    env_file:
      - .env
    volumes:
      - .:/app
      - storage_data:/app/storage
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/concertify_production
      RAILS_LOG_TO_STDOUT: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  storage_data:
  